<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cross Paper Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#262d38;--fg:#e6e9ee;--mute:#8a94a3;--up:#3ddc97;--down:#ff5c70;--acc:#f5b942}
:root[data-theme=light]{--bg:#f4f1ea;--panel:#fffdf8;--line:#ddd6c8;--fg:#1d2026;--mute:#6b7280;--up:#0f9d63;--down:#d6334a;--acc:#b97a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 'IBM Plex Mono',monospace}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
h1{font:700 22px 'Space Grotesk',sans-serif;margin:0;letter-spacing:-.02em}
h1 small{font:400 12px 'IBM Plex Mono';color:var(--acc);border:1px solid var(--acc);padding:1px 6px;margin-left:8px;vertical-align:middle}
button{background:transparent;color:var(--fg);border:1px solid var(--line);padding:8px 14px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
main{padding:24px;display:grid;gap:16px;max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px 16px}
.k{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.v{font:500 21px 'Space Grotesk',sans-serif;margin-top:4px}
.sub{color:var(--mute);font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th:last-child,td:last-child{text-align:left}th{color:var(--mute);font-weight:400;font-size:11px;text-transform:uppercase}
.err{color:var(--down)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:7px 10px;font:inherit;width:80px}
canvas{max-height:300px}
.bar{height:6px;background:var(--line);margin-top:8px}.bar i{display:block;height:100%;background:var(--acc)}
.note{color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Cross <small>PAPER ONLY - no real money</small></h1>
  <div class="row"><button id="theme">Theme</button><button id="pause">Pause new buys</button></div>
</header>
<main>
  <div id="err" class="err"></div>
  <section class="grid" id="stats"></section>
  <section class="card"><div class="k">Paper equity vs buy &amp; hold (hold shown without fees)</div><canvas id="chart"></canvas></section>
  <section class="card"><div class="k">Paper trades</div>
    <table><thead><tr><th>Time</th><th>Side</th><th>Price</th><th>Qty</th><th>Fee</th><th>P&amp;L</th><th>Why</th></tr></thead><tbody id="trades"></tbody></table>
  </section>
  <section class="card">
    <div class="row"><div class="k">Walk-forward backtest (15m candles, model only sees the past)</div>
      <input id="days" type="number" min="2" max="30" value="14"><button id="bt">Run</button></div>
    <div id="btout" style="margin-top:10px"></div><canvas id="btchart"></canvas>
    <div class="note">Past results do not predict future results. Accuracy near 50% means the predictor has no edge.</div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const usd = n => n == null ? '-' : n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:n < 10 ? 4 : 2});
const pct = n => n == null ? '-' : (n * 100).toFixed(1) + '%';
const cls = n => n >= 0 ? 'up' : 'down';
const text = (el, s) => { el.textContent = s; return el; };  // textContent only: no HTML injection
let chart, btchart, paused = false;
const STATIC = location.protocol === 'https:' && !location.hostname.startsWith('127.') && location.hostname !== 'localhost';  // GitHub Pages: read snapshot.json, no controls
if (STATIC) { $('#pause').hidden = true; $('#bt').closest('section').hidden = true; }

const root = document.documentElement;
try { root.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch { root.dataset.theme = 'dark'; }
$('#theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('theme', root.dataset.theme); } catch {} };

function stat(k, v, c = '', sub = '', bar = null){
  const d = document.createElement('div'); d.className = 'card';
  const a = text(document.createElement('div'), k); a.className = 'k';
  const b = text(document.createElement('div'), v); b.className = 'v ' + c;
  d.append(a, b);
  if (sub) d.append(text(Object.assign(document.createElement('div'), {className:'sub'}), sub));
  if (bar != null) { const w = document.createElement('div'); w.className = 'bar'; const i = document.createElement('i'); i.style.width = Math.min(100, bar * 100) + '%'; w.append(i); d.append(w); }
  return d;
}

function view(p){
  if (p == null) return ['warming up', '', 'model not ready'];
  return [(p * 100).toFixed(0) + '% up', p >= 0.5 ? 'up' : 'down'];
}

async function refresh(){
  let s;
  try { s = await (await fetch(STATIC ? 'snapshot.json?t=' + Date.now() : '/api/state')).json(); } catch { text($('#err'), STATIC ? 'No data yet - start the workflow' : 'Server unreachable'); return; }
  const age = STATIC && s.updated ? (Date.now() / 1000 - s.updated) / 60 : 0;
  text($('#err'), s.error || (s.finished ? 'Run complete.' : age > 45 ? `Stale: last saved ${Math.round(age)} min ago (waiting for the next cloud job)` : ''));
  paused = s.paused; text($('#pause'), paused ? 'Resume buying' : 'Pause new buys');
  if (!s.price) { text($('#err'), s.error || 'Loading market data...'); return; }
  const pnl = s.equity - s.capital, vs = s.equity - s.buy_hold_equity, st = s.stats;
  const wait = Math.max(0, Math.round(s.next_check - Date.now() / 1000));
  const nextTxt = STATIC ? `saved ${Math.max(0, Math.round(age * 60))}s ago` : 'next check ' + wait + 's';
  const [pv, pc] = view(s.p_up);
  $('#stats').replaceChildren(
    stat(s.product, usd(s.price), '', 'live Coinbase price'),
    stat('Paper equity', usd(s.equity), cls(pnl), `started with ${usd(s.capital)}`),
    stat('P&L', (pnl >= 0 ? '+' : '') + usd(pnl), cls(pnl), (pnl / s.capital * 100).toFixed(2) + '%'),
    stat('vs buy & hold', (vs >= 0 ? '+' : '') + usd(vs), cls(vs), 'hold would be ' + usd(s.buy_hold_equity)),
    stat('Position', s.position, '', s.position_entry ? 'entry ' + usd(s.position_entry) : (paused ? 'new buys paused' : 'waiting for signal')),
    stat(`Prediction (${s.horizon_min}m ahead)`, pv, pc, `buy ≥ ${(s.entry_p * 100).toFixed(0)}%, sell ≤ ${(s.exit_p * 100).toFixed(0)}%`),
    stat('Predictor accuracy', pct(st.pred_accuracy), '', `${st.pred_resolved} graded; ≥${(s.entry_p*100).toFixed(0)}% calls right ${pct(st.strong_precision)} (n=${st.strong_n})`),
    stat('Trades', `${st.round_trips} round trips`, '', `win rate ${pct(st.win_rate)}, fees ${usd(st.fees_paid)}`),
    stat('Max drawdown', s.max_drawdown_pct.toFixed(2) + '%', 'down'),
    stat('5-day run', `day ${s.elapsed_days.toFixed(2)} / ${s.run_days}`, '', paused ? 'paused' : nextTxt, s.elapsed_days / s.run_days),
  );
  const labels = s.curve.map(p => new Date(p.t * 1000).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}));
  const p0 = s.curve.length ? s.curve[0].p : s.price;
  const ds = [
    {label:'Bot equity', data:s.curve.map(p => p.e), borderColor:'#3ddc97', pointRadius:0, borderWidth:2},
    {label:'Buy & hold', data:s.curve.map(p => s.capital * p.p / p0), borderColor:'#8a94a3', pointRadius:0, borderWidth:1.5},
  ];
  const opts = {animation:false, scales:{y:{ticks:{color:'#8a94a3'}}, x:{ticks:{color:'#8a94a3',maxTicksLimit:7}}}, plugins:{legend:{labels:{color:'#8a94a3'}}}};
  if (!chart) chart = new Chart($('#chart'), {type:'line', data:{labels, datasets:ds}, options:opts});
  else { chart.data.labels = labels; chart.data.datasets = ds; chart.update(); }

  $('#trades').replaceChildren(...[...s.trades].reverse().map(t => {
    const tr = document.createElement('tr');
    const cells = [new Date(t.ts * 1000).toLocaleString(), t.side.toUpperCase(), usd(t.price), t.qty.toFixed(6), usd(t.fee), t.pnl == null ? '-' : usd(t.pnl), t.reason];
    cells.forEach((c, i) => { const td = text(document.createElement('td'), c); if (i === 5 && t.pnl != null) td.className = cls(t.pnl); tr.append(td); });
    return tr;
  }));
}

$('#pause').onclick = async () => {
  await fetch('/api/pause', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({paused:!paused})});
  refresh();
};

$('#bt').onclick = async () => {
  const out = $('#btout'); text(out, 'Running... (about 10s)');
  let d;
  try { d = await (await fetch('/api/backtest?days=' + encodeURIComponent($('#days').value))).json(); } catch { text(out, 'Request failed'); return; }
  if (d.error) { text(out, d.error); return; }
  const s = d.stats;
  text(out, `Bot ${d.return_pct.toFixed(2)}% | Buy&Hold ${d.buy_hold_pct.toFixed(2)}% | drawdown ${d.max_drawdown_pct.toFixed(1)}% | ${s.round_trips} trades, win ${pct(s.win_rate)} | predictor accuracy ${pct(s.pred_accuracy)}`);
  const base = d.curve[0].price;
  const ds = [
    {label:'Bot equity', data:d.curve.map(p => p.equity), borderColor:'#3ddc97', pointRadius:0},
    {label:'Buy & hold', data:d.curve.map(p => p.price / base * d.curve[0].equity), borderColor:'#8a94a3', pointRadius:0},
  ];
  const labels = d.curve.map(p => new Date(p.t * 1000).toLocaleDateString());
  if (btchart) btchart.destroy();
  btchart = new Chart($('#btchart'), {type:'line', data:{labels, datasets:ds}, options:{animation:false, scales:{x:{ticks:{maxTicksLimit:8,color:'#8a94a3'}}, y:{ticks:{color:'#8a94a3'}}}, plugins:{legend:{labels:{color:'#8a94a3'}}}}});
};

// Pages mode: Coinbase websocket streams every trade tick straight to the browser (sub-second)
let snap = null, ws = null, lastDraw = 0;
function liveDraw(px){
  const now = performance.now(); if (now - lastDraw < 100) return; lastDraw = now;  // max ~10 repaints/s
  const cards = $('#stats').children; if (!snap || cards.length < 4) return;
  const set = (i, v, c, sub) => { const k = cards[i]; const e = k.querySelector('.v'); e.textContent = v; if (c != null) e.className = 'v ' + c; if (sub != null) k.querySelector('.sub').textContent = sub; };
  set(0, usd(px), '', 'live Coinbase tick');
  if (snap.cash != null) {
    const eq = snap.cash + snap.qty * px, pnl = eq - snap.capital, hold = snap.buy_hold_equity / snap.price * px, vs = eq - hold;
    set(1, usd(eq), cls(pnl)); set(2, (pnl >= 0 ? '+' : '') + usd(pnl), cls(pnl), (pnl / snap.capital * 100).toFixed(2) + '%');
    set(3, (vs >= 0 ? '+' : '') + usd(vs), cls(vs), 'hold would be ' + usd(hold));
  }
}
function connect(){
  if (ws || !snap) return;
  ws = new WebSocket('wss://ws-feed.exchange.coinbase.com');
  ws.onopen = () => ws.send(JSON.stringify({type:'subscribe', product_ids:[snap.product], channels:['ticker']}));
  ws.onmessage = e => { try { const m = JSON.parse(e.data); if (m.type === 'ticker' && m.price) liveDraw(parseFloat(m.price)); } catch {} };
  ws.onclose = ws.onerror = () => { ws = null; setTimeout(connect, 2000); };
}
const _refresh = refresh;
refresh = async function(){
  await _refresh();
  if (!STATIC) return;
  try { snap = await (await fetch('snapshot.json?t=' + Date.now())).json(); } catch { return; }
  connect();
};
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
