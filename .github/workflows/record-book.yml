name: record-book
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record-book
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_SECONDS: "19800"   # 330 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scikit-learn websocket-client
      - name: Restore earlier recording
        run: |
          if git ls-remote --exit-code --heads origin book >/dev/null 2>&1; then
            git fetch -q --depth 1 origin book && git show FETCH_HEAD:book.csv > book.csv || rm -f book.csv
          fi
      - run: python research/record_book.py
      - if: always()
        run: bash scripts/publish_book.sh
