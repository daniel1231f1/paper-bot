name: paper-bot
on:
  schedule:
    - cron: "17 * * * *"   # hourly; extra triggers just queue behind the running job
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-bot
  cancel-in-progress: false   # never kill the running bot; the next one waits its turn
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISH: "1"
      RUN_SECONDS: "20400"   # 340 min, then hand over to the next job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore state
        run: bash scripts/restore_state.sh
      - name: Run bot
        run: python run_cloud.py
      - name: Save state
        if: always()
        run: bash scripts/publish_state.sh
